name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the secret scan

      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --no-banner

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Same services as local development; .env.example holds local-only defaults.
      - name: Start services
        run: |
          cp .env.example .env
          # The end-to-end tests run the production build, which refuses to start
          # with the example placeholder secrets. Generate throwaway ones.
          sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env
          docker compose up -d --wait

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Schema matches migrations
        run: pnpm db:drift

      - name: Seed
        run: pnpm db:seed

      - name: Environment health check
        run: pnpm healthcheck

      - name: Integration tests
        run: pnpm test:int

      - name: Production build
        run: pnpm build

      - name: Install browser for end-to-end tests
        # Downloads from outside GitHub; fail fast and retry once instead of
        # hanging until the job limit.
        timeout-minutes: 8
        run: |
          timeout 210 pnpm exec playwright install --with-deps chromium ||
            { echo "First attempt failed or stalled; retrying"; sleep 10;
              timeout 210 pnpm exec playwright install --with-deps chromium; }

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
